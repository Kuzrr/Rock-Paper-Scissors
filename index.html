<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="content">
        <div class="header">
            <h1>Rock Paper Scissors</h1>
            <h3>First ot get 5 points wins!</h3>
        </div>
        <div class = "score">
            <p>Player score: <span id = "playerScore"></span></p>
            <p>Computer score: <span id = "computerScore"></span></p>
        </div>

        <div class="game">

            <button id="rock"><img src="img/rock.png" alt="rock" height="80px" width="80px"></button>
            <button id="paper"><img src="img/paper.png" alt="paper" height="80px" width="80px"></button>
            <button id="scissors"><img src="img/scissors.png" alt="scissors" height="80px" width="80px"></button>
    </div>
    <div class="resoults">
        <p>Player choice: <span id="playerChoice"></span></p>
        <p>Computer choice: <span id="computerChoice"></span></p>
        <p id="resoults"></p>
    </div>
    </div>
</body>
</html>
