<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="content">
        <h1>Rock Paper Scissors</h1>
        <div class = "score">
            <h2>First ot get 5 points wins!</h2>
            <p>Player score: <span id = "playerScore"></span></p>
            <p>Computer score: <span id = "computerScore"></span></p>
        </div>

        <div class="game">

            <button id="rock">Rock</button>
            <button id="paper">Paper</button>
            <button id="scissors">Scissors</button>
    </div>
    <div class="resoults">
        <p>Player choice: <span id="playerChoice"></span></p>
        <p>Computer choice: <span id="computerChoice"></span></p>
        <p id="resoults"></p>
    </div>
</body>
</html>
